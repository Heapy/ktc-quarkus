tasks:
  quarkusBuild:
    action: !io.heapy.ktc.quarkus.quarkusBuild
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      outputDir: ${taskOutputDir}
      effectiveConfig: ${tasks.quarkusEffectiveConfig.action.configFile}
      moduleName: ${module.name}
      settings: ${pluginSettings}
      nativeImage: false

  quarkusNative:
    action: !io.heapy.ktc.quarkus.quarkusBuild
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      outputDir: ${taskOutputDir}
      effectiveConfig: ${tasks.quarkusEffectiveConfig.action.configFile}
      moduleName: ${module.name}
      settings: ${pluginSettings}
      nativeImage: true

  quarkusRun:
    action: !io.heapy.ktc.quarkus.quarkusRun
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      packagedApplication: ${tasks.quarkusBuild.action.outputDir}
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      settings: ${pluginSettings}

  quarkusImageBuild:
    action: !io.heapy.ktc.quarkus.quarkusImage
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      settings: ${pluginSettings}
      push: false

  quarkusImagePush:
    action: !io.heapy.ktc.quarkus.quarkusImage
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      settings: ${pluginSettings}
      push: true

  quarkusDeploy:
    action: !io.heapy.ktc.quarkus.quarkusDeploy
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      settings: ${pluginSettings}

  quarkusEffectiveConfig:
    action: !io.heapy.ktc.quarkus.quarkusEffectiveConfig
      resources: ${module.resources}
      configFile: ${taskOutputDir}/effective-config.properties
      moduleName: ${module.name}
      settings: ${pluginSettings}

  quarkusShowEffectiveConfig:
    action: !io.heapy.ktc.quarkus.quarkusShowEffectiveConfig
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      settings: ${pluginSettings}

  quarkusTestModel:
    action: !io.heapy.ktc.quarkus.quarkusTestModel
      classes: ${module.classes}
      resources: ${module.resources}
      runtimeClasspath: ${module.runtimeClasspath}
      moduleDir: ${module.rootDir}
      modelDir: ${taskOutputDir}/model
      testResourcesDir: ${taskOutputDir}/test-resources
      moduleName: ${module.name}
      settings: ${pluginSettings}

commands:
  - quarkusBuild
  - quarkusNative
  - quarkusRun
  - quarkusImageBuild
  - quarkusImagePush
  - quarkusDeploy
  - quarkusShowEffectiveConfig

generated:
  resources:
    - directory: ${tasks.quarkusTestModel.action.testResourcesDir}
      fragment:
        isTest: true
